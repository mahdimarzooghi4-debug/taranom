name: Sprint 02 Member Web App

on:
  push:
    branches: [sprint-02-member-webapp-foundation]
  pull_request:
    branches: [docs/member-webapp-sprint-02-plan]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  member-web-build-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/member-web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install exact direct dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Typecheck and production build
        run: |
          npm run typecheck
          npm run build
      - name: Verify member API clients are host-authenticated and no fake state exists
        run: |
          PYTHONPATH=../.. python3 -m unittest discover -s ../../tests/policy_checks -p 'test_member_web_api_boundary.py' -v
          python3 ../../tools/policy_checks/check_member_web_api_boundary.py --source-root src
      - name: Install Chromium for browser-level tests
        run: npx playwright install --with-deps chromium
      - name: Run Playwright member web browser tests
        run: npm run test:e2e
        env:
          CI: 'true'
      - name: Upload browser test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sprint02-member-playwright
          path: |
            apps/member-web/test-results/results.xml
            apps/member-web/test-results/**/trace.zip
          if-no-files-found: warn
