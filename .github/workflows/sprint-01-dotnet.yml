name: Sprint 01 .NET Synthetic Foundation

on:
  push:
    branches:
      - sprint-01-dotnet-identity-consent-audit
  pull_request:
    branches:
      - docs/technical-foundation-01
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: only_synthetic_ci
          POSTGRES_DB: taranom_sprint01
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d taranom_sprint01"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      TARANOM_TEST_PG: Host=localhost;Port=5432;Database=taranom_sprint01;Username=postgres;Password=only_synthetic_ci;Pooling=false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.401'
      - name: Verify .NET version and build foundation
        run: |
          dotnet --info
          dotnet restore tests/Taranom.SmokeTests/Taranom.SmokeTests.csproj
          dotnet build tests/Taranom.SmokeTests/Taranom.SmokeTests.csproj --no-restore --configuration Release
          dotnet restore tests/Taranom.ContractTests/Taranom.ContractTests.csproj
          dotnet build tests/Taranom.ContractTests/Taranom.ContractTests.csproj --no-restore --configuration Release
      - name: Run independent xUnit contract tests FIRST (self-bootstrap PostgreSQL)
        run: |
          mkdir -p TestResults
          dotnet run --project tests/Taranom.ContractTests/Taranom.ContractTests.csproj --no-build --configuration Release -- -xml TestResults/sprint01-contract-tests.xml
          test -s TestResults/sprint01-contract-tests.xml
      - name: Run synthetic .NET smoke and PostgreSQL failure-injection tests
        run: dotnet run --project tests/Taranom.SmokeTests/Taranom.SmokeTests.csproj --no-build --configuration Release
      - name: Upload xUnit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sprint01-contract-tests
          path: TestResults/sprint01-contract-tests.xml
          if-no-files-found: warn
      - name: Verify no real service adapters or AI in the Sprint 01 code
        run: |
          test ! -d src/Taranom.AI
          test ! -d src/Taranom.Clinical
          test ! -d src/Taranom.Payments
          test ! -d src/Taranom.Api
          # The project contains no deployable API; only the contract library and smoke harness.
          test "$(find src -name '*.csproj' | wc -l)" -eq 1
          test "$(find tests -name '*.csproj' | wc -l)" -eq 2
