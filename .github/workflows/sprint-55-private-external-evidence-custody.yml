          POSTGRES_PASSWORD: only_synthetic_ci
          POSTGRES_DB: taranom_sprint10_evidence_review
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d taranom_sprint10_evidence_review"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      TARANOM_TEST_PG: Host=localhost;Port=5432;Database=taranom_sprint10_evidence_review;Username=postgres;Password=only_synthetic_ci;Pooling=false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.401'
      - name: Compile isolated Npgsql review intake test implementation
        run: |
          dotnet restore tests/Taranom.ClinicalEvidenceJournal.IntegrationTests/Taranom.ClinicalEvidenceJournal.IntegrationTests.csproj
          dotnet build tests/Taranom.ClinicalEvidenceJournal.IntegrationTests/Taranom.ClinicalEvidenceJournal.IntegrationTests.csproj --no-restore --configuration Release
      - name: Exercise inherited synthetic PostgreSQL review integrity tests and center modal focus-isolation regressions
        run: |
          mkdir -p TestResults
          dotnet run --project tests/Taranom.ClinicalEvidenceJournal.IntegrationTests/Taranom.ClinicalEvidenceJournal.IntegrationTests.csproj --no-build --configuration Release -- -xml TestResults/sprint55-review-evidence-postgres.xml
          test -s TestResults/sprint55-review-evidence-postgres.xml
      - name: Confirm no real identity or clinical activation runtime
        run: |
          test ! -d src/Taranom.CenterApi
          if grep -R -E 'HttpClient|JwtBearer|/api/v1/|NationalId|ClinicalRecord|Wallet|Bearer |ApprovedLicense|ProfessionalActivation' src/Taranom.ClinicalEvidenceJournal.Postgres --include='*.cs'; then
            echo 'Rejected unapproved clinical integration in test-only evidence journal' >&2
            exit 1
          fi
      - name: Upload evidence review PostgreSQL report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sprint55-review-evidence-postgres
          path: TestResults/sprint55-review-evidence-postgres.xml
          if-no-files-found: warn
