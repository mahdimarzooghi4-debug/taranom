name: Taranom Shared 14-Gate Full Regression

on:
  workflow_call:

permissions:
  contents: read

jobs:
  internal-contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0  # full reachable history for public-source policy audit
      - name: Reject high-confidence secrets in reachable public Git history
        run: |
          python3 -m unittest discover -s tests/policy_checks -p 'test_public_source_history.py' -v
          mkdir -p TestResults
          python3 tools/policy_checks/check_public_source_history.py --root . --history --report-json TestResults/fullci-public-history-safety.json
          test -s TestResults/fullci-public-history-safety.json
      - name: Validate 13 Epic capability measurement without inventing percentages
        run: |
          python3 -m unittest discover -s tests/policy_checks -p 'test_epic_capability_progress.py' -v
          python3 tools/policy_checks/check_epic_capability_progress.py --root . --report-json TestResults/fullci-epic-progress.json
          python3 -c "import json; p=json.load(open('TestResults/fullci-epic-progress.json')); assert p['status']=='DRAFT_EVIDENCE_CATALOG_ONLY' and p['epic_count']==13 and p['provisional_capabilities']==39 and p['external_blockers_unverified']==17 and p['overall_implementation_completion_pct'] is None and not p['national_release_allowed']"
      - name: Build and security-test offline Epic delivery console and CSV
        run: |
          python3 -m unittest discover -s tests/policy_checks -p 'test_epic_progress_console.py' -v
          python3 tools/policy_checks/render_epic_progress_console.py --root . --html TestResults/fullci-epic-console.html --csv TestResults/fullci-epic-console.csv
          test -s TestResults/fullci-epic-console.html
          test -s TestResults/fullci-epic-console.csv
      - name: Deny unsafe public GitHub Actions workflow definitions
        run: |
          python3 -m unittest discover -s tests/policy_checks -p 'test_public_ci_workflow_trust.py' -v
          python3 -m unittest discover -s tests/policy_checks -p 'test_shared_full_ci.py' -v
          python3 tools/policy_checks/check_public_ci_workflow_trust.py --root . --report-json TestResults/fullci-workflow-trust.json
          test -s TestResults/fullci-workflow-trust.json
      # Sprint59 tests keep all actual private target files outside GitHub Actions.
      - name: Verify external identity TLS preflight contract without network or provider
        run: |
          python3 -m unittest discover -s tests/policy_checks -p 'test_identity_tls_preflight.py' -v
          python3 -m unittest discover -s tests/policy_checks -p 'test_private_oidc_discovery.py' -v
          python3 -m unittest discover -s tests/policy_checks -p 'test_private_fhir_capability.py' -v
          python3 -m unittest discover -s tests/policy_checks -p 'test_ephemeral_pg_recovery.py' -v
          python3 tools/policy_checks/check_private_fhir_capability.py --root . --report-json TestResults/fullci-fhir-capability-unconfigured.json
          python3 -c "import json; d=json.load(open('TestResults/fullci-fhir-capability-unconfigured.json')); assert d['status']=='TARGET_NOT_CONFIGURED' and not d['fhir_data_exchange_verified'] and not d['national_release_allowed']"
          python3 tools/policy_checks/check_private_oidc_discovery.py --root . --report-json TestResults/fullci-oidc-discovery-unconfigured.json
          python3 -c "import json; d=json.load(open('TestResults/fullci-oidc-discovery-unconfigured.json')); assert d['status']=='TARGET_NOT_CONFIGURED' and not d['member_authentication_verified'] and not d['national_release_allowed']"
          python3 tools/policy_checks/check_identity_tls_preflight.py --purpose AUTHENTICATION_IDP --report-json TestResults/fullci-identity-preflight-unconfigured.json
          python3 -c "import json; r=json.load(open('TestResults/fullci-identity-preflight-unconfigured.json')); assert r['status']=='TARGET_NOT_CONFIGURED' and not r['tls_transport_reachable'] and not r['national_release_allowed']"
      - name: Validate private evidence custody contract without uploading external evidence
        run: |
          python3 -m unittest discover -s tests/policy_checks -p 'test_private_external_evidence.py' -v
          python3 -m unittest discover -s tests/policy_checks -p 'test_private_evidence_batch.py' -v
          python3 -m unittest discover -s tests/policy_checks -p 'test_private_evidence_delta.py' -v
          python3 tools/policy_checks/check_private_external_evidence.py --root . --evidence-root . --manifest docs/governance/external-evidence-intake-template.json --report-json TestResults/fullci-private-evidence-empty.json
          test -s TestResults/fullci-private-evidence-empty.json
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.401'
      - name: Reject known external AI SDK, inference endpoints and API credentials
        run: |
          python3 -m unittest discover -s tests/policy_checks -p 'test_external_ai_boundary.py' -v
          python3 tools/policy_checks/check_external_ai_boundary.py --root .
      - name: Verify comprehensive national release blockers remain DENY-ONLY
        run: |
          python3 -m unittest discover -s tests/policy_checks -p 'test_national_launch_blockers.py' -v
          mkdir -p TestResults
          python3 tools/policy_checks/check_national_launch_blockers.py --root . --report-json TestResults/fullci-national-blockers.json
          test -s TestResults/fullci-national-blockers.json
      - name: Build bounded member governance contract project
        run: |
          dotnet restore tests/Taranom.MemberGovernance.Tests/Taranom.MemberGovernance.Tests.csproj
          dotnet build tests/Taranom.MemberGovernance.Tests/Taranom.MemberGovernance.Tests.csproj --no-restore --configuration Release
      - name: Execute standalone xUnit governance tests
        run: |
          mkdir -p TestResults
          dotnet run --project tests/Taranom.MemberGovernance.Tests/Taranom.MemberGovernance.Tests.csproj --no-build --configuration Release -- -xml TestResults/sprint03-governance.xml
          test -s TestResults/sprint03-governance.xml
      - name: Check missing external adapters remain explicitly blocked
        run: |
          test ! -d src/Taranom.Api
          test ! -d src/Taranom.IdentityProvider
          test ! -d src/Taranom.Payments
          test ! -d src/Taranom.Clinical
          if grep -R -E 'HttpClient|Npgsql|SqlConnection|JwtBearer|Bearer ' src/Taranom.MemberGovernance --include='*.cs'; then
            echo 'Unapproved runtime adapter found in internal governance kernel' >&2
            exit 1
          fi
      - name: Upload machine-readable contract evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fullci-internal-member-governance
          path: |
            TestResults/sprint03-governance.xml
            TestResults/fullci-national-blockers.json
            TestResults/fullci-public-history-safety.json
            TestResults/fullci-private-evidence-empty.json
            TestResults/fullci-workflow-trust.json
            TestResults/fullci-identity-preflight-unconfigured.json
            TestResults/fullci-epic-progress.json
            TestResults/fullci-epic-console.html
            TestResults/fullci-epic-console.csv
          if-no-files-found: warn

  synthetic-sprint01-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: only_synthetic_ci
          POSTGRES_DB: taranom_sprint01
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d taranom_sprint01"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      TARANOM_TEST_PG: Host=localhost;Port=5432;Database=taranom_sprint01;Username=postgres;Password=only_synthetic_ci;Pooling=false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.401'
      - name: Build inherited Sprint 01 test projects
        run: |
          dotnet restore tests/Taranom.SmokeTests/Taranom.SmokeTests.csproj
          dotnet build tests/Taranom.SmokeTests/Taranom.SmokeTests.csproj --no-restore --configuration Release
          dotnet restore tests/Taranom.ContractTests/Taranom.ContractTests.csproj
          dotnet build tests/Taranom.ContractTests/Taranom.ContractTests.csproj --no-restore --configuration Release
      - name: Run inherited xUnit and real PostgreSQL failure-injection regression
        run: |
          mkdir -p TestResults
          dotnet run --project tests/Taranom.ContractTests/Taranom.ContractTests.csproj --no-build --configuration Release -- -xml TestResults/sprint01-regression.xml
          test -s TestResults/sprint01-regression.xml
          dotnet run --project tests/Taranom.SmokeTests/Taranom.SmokeTests.csproj --no-build --configuration Release
      - name: Upload inherited .NET evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fullci-sprint01-regression
          path: TestResults/sprint01-regression.xml
          if-no-files-found: warn

  member-web-sprint02-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/member-web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Reproducible dependencies, TypeScript, and production bundle
        run: |
          npm ci --no-audit --no-fund --ignore-scripts
          npm run typecheck
          npm run build
      - name: Verify compiled member bundle integrity and active local resources
        run: |
          PYTHONPATH=../.. python3 -m unittest discover -s ../../tests/artifact_checks -p 'test_disconnected_bundle.py' -v
          python3 ../../tools/artifact_checks/check_disconnected_bundle.py --surface member --dist dist --output TestResults/fullci-member-bundle.json
          python3 ../../tools/artifact_checks/check_disconnected_bundle.py --surface member --dist dist --verify TestResults/fullci-member-bundle.json
          test -s TestResults/fullci-member-bundle.json
      - name: Verify shell still contains no fake member/identity backend
        run: |
          test ! -e src/fixtures
          test ! -e src/mocks
          test ! -e src/auth-provider.ts
          if grep -R -E -i 'localStorage\.setItem|sessionStorage\.setItem|/api/v1/|Bearer |fake(balance|login|token)' src; then
            echo 'Forbidden member-state adapter found' >&2
            exit 1
          fi
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser tests against the built Vite bundle
        run: npm run test:e2e
        env:
          CI: 'true'
      - name: Upload browser regression evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fullci-sprint02-browser-regression
          path: |
            apps/member-web/test-results/results.xml
            apps/member-web/TestResults/fullci-member-bundle.json
            apps/member-web/test-results/**/trace.zip
          if-no-files-found: warn

  isolated-proofing-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: only_synthetic_ci
          POSTGRES_DB: taranom_sprint03_isolated
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d taranom_sprint03_isolated"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      TARANOM_TEST_PG: Host=localhost;Port=5432;Database=taranom_sprint03_isolated;Username=postgres;Password=only_synthetic_ci;Pooling=false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.401'
      - name: Build separate non-deployable PostgreSQL integration tests
        run: |
          dotnet restore tests/Taranom.ProofingJournal.IntegrationTests/Taranom.ProofingJournal.IntegrationTests.csproj
          dotnet build tests/Taranom.ProofingJournal.IntegrationTests/Taranom.ProofingJournal.IntegrationTests.csproj --no-restore --configuration Release
      - name: Verify atomic rollback, concurrent replay, append-only audit and divergence detection
        run: |
          mkdir -p TestResults
          dotnet run --project tests/Taranom.ProofingJournal.IntegrationTests/Taranom.ProofingJournal.IntegrationTests.csproj --no-build --configuration Release -- -xml TestResults/sprint03-proofing-postgres.xml
          test -s TestResults/sprint03-proofing-postgres.xml
      - name: Verify journal is not a deployable identity/API adapter
        run: |
          test ! -d src/Taranom.Api
          test ! -d src/Taranom.IdentityProvider
          ! grep -R -E 'HttpClient|JwtBearer|/api/v1/|NationalId|HealthRecord|Wallet' src/Taranom.ProofingJournal.Postgres --include='*.cs'
      - name: Upload database integration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fullci-proofing-postgres-tests
          path: TestResults/sprint03-proofing-postgres.xml
          if-no-files-found: warn

  internal-clinical-center-governance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
