      - name: Restore and build the separate synthetic PostgreSQL center journal
        run: |
          dotnet restore tests/Taranom.ClinicalCenterJournal.IntegrationTests/Taranom.ClinicalCenterJournal.IntegrationTests.csproj
          dotnet build tests/Taranom.ClinicalCenterJournal.IntegrationTests/Taranom.ClinicalCenterJournal.IntegrationTests.csproj --no-restore --configuration Release
      - name: Test transactional projection audit replay concurrency and fail closed
        run: |
          mkdir -p TestResults
          dotnet run --project tests/Taranom.ClinicalCenterJournal.IntegrationTests/Taranom.ClinicalCenterJournal.IntegrationTests.csproj --no-build --configuration Release -- -xml TestResults/fullci-center-postgres.xml
          test -s TestResults/fullci-center-postgres.xml
      - name: Reject live backend or professional credential code in test adapter
        run: |
          test ! -d src/Taranom.ClinicalApi
          test ! -d src/Taranom.CenterApi
          if grep -R -E 'HttpClient|JwtBearer|/api/v1/|NationalId|ClinicalRecord|MedicalLicense|Wallet|Bearer ' src/Taranom.ClinicalCenterJournal.Postgres --include='*.cs'; then
            echo 'Unapproved adapter for real identity or clinical data' >&2
            exit 1
