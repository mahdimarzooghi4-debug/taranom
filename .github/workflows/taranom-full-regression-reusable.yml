          anchor_tmp=$(mktemp -d /tmp/taranom-anchor-XXXXXX)
          TARANOM_AI_WORKER_ANCHOR_DIR="$anchor_tmp" python3 tools/qa/worker_evidence_anchor.py create
          # TRN-TECH-157: an actual separate, UNPRIVILEGED Linux uid
          # keeps a second checkpoint unreadable by the Worker host uid.
          # The CI runner has sudo: this is a DAC rehearsal, not legal custody.
          qa_custody=$(mktemp -d /tmp/taranom-anchor-XXXXXX)
          qa_shared=$(mktemp -d /tmp/taranom-worker-XXXXXX)
          qa_tools=$(mktemp -d /tmp/taranom-custody-tools-XXXXXX)
          export TARANOM_QA_CUSTODY_DIR="$qa_custody"
          export TARANOM_QA_SHARED_DIR="$qa_shared"
          export TARANOM_QA_TOOLS_DIR="$qa_tools"
          python3 tools/qa/worker_posix_custody_ci.py prepare
          kill -TERM "$server_pid"
          wait "$server_pid" || true
          stopped=0
          for attempt in $(seq 1 30); do
            if ! curl --silent --fail --max-time 2 http://127.0.0.1:4320/internal/demo/v1/centers/test:readiness > /dev/null; then stopped=1; break; fi
            sleep 1
          done
          test "$stopped" = "1"
          cd "$GITHUB_WORKSPACE/src/Taranom.CenterWorkflow.Demo"
          TARANOM_AI_ADMIN_QA=CI_EPHEMERAL_ONLY TARANOM_COST_JOURNAL_DEMO=CI_EPHEMERAL_ONLY TARANOM_ORG_DRAFT_QA=CI_EPHEMERAL_ONLY dotnet run --no-build --configuration Release > /tmp/taranom-center-restart-ephemeral.log 2>&1 &
          server_pid=$!
          trap 'kill "$ops_pid" "$server_pid" 2>/dev/null || true' EXIT
          cd "$GITHUB_WORKSPACE"
          restart_ready=0
          for attempt in $(seq 1 60); do
            if curl --silent --fail --max-time 2 http://127.0.0.1:4320/internal/demo/v1/centers/test:readiness > /dev/null; then restart_ready=1; break; fi
            sleep 1
          done
          if test "$restart_ready" != "1"; then
            echo "Disposable Kestrel restart failed" >&2
            exit 1
          fi
          python3 tests/center_demo/test_ai_worker_restart_http.py
          python3 tools/qa/verify_ai_worker_evidence.py
          TARANOM_AI_WORKER_ANCHOR_DIR="$anchor_tmp" python3 tools/qa/worker_evidence_anchor.py verify
          # TRN-TECH-156: run a separate verifier-side export, copy ONLY
          # the public synthetic ZIP to a disposable receiving directory,
          # then verify it in another process using the independently held
          # HMAC receipt. The custodian key NEVER accompanies the ZIP.
          handoff_out=$(mktemp -d /tmp/taranom-handoff-XXXXXX)
          handoff_in=$(mktemp -d /tmp/taranom-handoff-XXXXXX)
          TARANOM_AI_WORKER_ANCHOR_DIR="$anchor_tmp" TARANOM_AI_WORKER_HANDOFF_DIR="$handoff_out" python3 tools/qa/worker_evidence_handoff.py export
          cp -- "$handoff_out/worker-evidence.zip" "$handoff_in/worker-evidence.zip"
          TARANOM_AI_WORKER_ANCHOR_DIR="$anchor_tmp" TARANOM_AI_WORKER_HANDOFF_DIR="$handoff_in" python3 tools/qa/worker_evidence_handoff.py receive
          # The test-only Worker archive is structurally verifiable.
          # An *absent* outside custodian receipt must remain unverified;
          # never fabricate a signature, identity or provider acknowledgement.
          TARANOM_AI_WORKER_HANDOFF_DIR="$handoff_in" python3 tools/qa/worker_external_receipt_denial.py --claim-template docs/governance/ai-worker-external-receipt-template.json --report-json "$bridge_tmp/external-receipt-denial.json"
          python3 -c "import json,os; r=json.load(open(os.environ['TARANOM_AI_RESTART_WITNESS'].replace('epoch-witness.json','external-receipt-denial.json'))); assert r['status']=='EXTERNAL_RECEIPT_NOT_SUPPLIED' and not r['external_receipt_verified'] and not r['independent_custody_verified'] and not r['human_release_approved'] and not r['production_ready'] and not r['national_release_allowed']"
          # TRN-TECH-160: no outside identity authority or trusted root.
          # Even a perfectly matching synthetic claim remains unverified.
          TARANOM_AI_WORKER_HANDOFF_DIR="$handoff_in" python3 tools/qa/worker_custodian_identity_boundary.py --identity-template docs/governance/ai-worker-custodian-identity-template.json --receipt-template docs/governance/ai-worker-external-receipt-template.json --report-json "$bridge_tmp/custodian-identity-denial.json"
          python3 -c "import json,os,pathlib; r=json.loads((pathlib.Path(os.environ['TARANOM_AI_RESTART_WITNESS']).parent/'custodian-identity-denial.json').read_text()); assert r['status']=='EXTERNAL_CUSTODIAN_IDENTITY_NOT_CONFIGURED' and r['synthetic_archive_shape_checked'] and not r['custodian_identity_verified'] and not r['separate_admin_domain_verified'] and not r['trust_anchor_verified'] and not r['external_receipt_verified'] and not r['human_release_approved'] and not r['production_ready'] and not r['national_release_allowed']"
          # Independently verify full chain after real restart under the
          # verifier-only POSIX account and prove requester DAC denial.
          python3 tools/qa/worker_posix_custody_ci.py finish
      - name: Rehearse real isolated PostgreSQL dump and restored journal integrity
        env:
          CI: 'true'
        run: |
          python3 tools/recovery/rehearse_ephemeral_postgres.py
