          dotnet run --project tests/Taranom.ClinicalCenterGovernance.Tests/Taranom.ClinicalCenterGovernance.Tests.csproj --no-build --configuration Release -- -xml TestResults/fullci-center-governance.xml
          test -s TestResults/fullci-center-governance.xml
      - name: Prove no independent network or clinical runtime entered this assembly
        run: |
          test ! -d src/Taranom.ClinicalApi
          ! grep -R -E 'HttpClient|Npgsql|JwtBearer|/api/v1/|NetworkAdministrator|ClinicalRecord|MedicalLicense|Wallet' src/Taranom.ClinicalCenterGovernance --include='*.cs'
      - name: Upload center governance test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fullci-internal-center-governance
          path: TestResults/fullci-center-governance.xml
