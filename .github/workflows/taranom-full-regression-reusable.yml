          # Show counter loss explicitly; NEVER declare continuity/audit success.
          cd "$GITHUB_WORKSPACE"
          test -s "$TARANOM_AI_RESTART_WITNESS"
          # TRN-TECH-155: verifier-owned disposable checkpoint OUTSIDE
