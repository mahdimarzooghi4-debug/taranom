      TARANOM_CENTER_DEMO_TEST_ONLY: CI_EPHEMERAL_ONLY
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.401'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Build existing event-sourced center journal with isolated ASP.NET demo host
        run: |
          dotnet restore src/Taranom.CenterWorkflow.Demo/Taranom.CenterWorkflow.Demo.csproj
          dotnet build src/Taranom.CenterWorkflow.Demo/Taranom.CenterWorkflow.Demo.csproj --no-restore --configuration Release
          cd apps/center-demo-web
          npm ci --no-audit --no-fund --ignore-scripts
          npm run typecheck
          npm run build
          mkdir -p ../../src/Taranom.CenterWorkflow.Demo/wwwroot
          cp -R dist/. ../../src/Taranom.CenterWorkflow.Demo/wwwroot/
          cd ../member-support-demo-web
          npm ci --no-audit --no-fund --ignore-scripts
          npm run typecheck
          npm run build
          mkdir -p ../../src/Taranom.CenterWorkflow.Demo/wwwroot/member-demo
          cp -R dist/. ../../src/Taranom.CenterWorkflow.Demo/wwwroot/member-demo/
      - name: Build separate opt-in CI-only local QA link to genuine journal host
        run: |
          dotnet restore src/Taranom.OperationsStatus/Taranom.OperationsStatus.csproj
          dotnet build src/Taranom.OperationsStatus/Taranom.OperationsStatus.csproj --no-restore --configuration Release
          cd apps/ops-web
          npm ci --no-audit --no-fund --ignore-scripts
          npm run typecheck
          npm run build
          mkdir -p ../../src/Taranom.OperationsStatus/wwwroot
          cp -R dist/. ../../src/Taranom.OperationsStatus/wwwroot/
          cd ../member-web
          npm ci --no-audit --no-fund --ignore-scripts
          npm run typecheck
          VITE_TARANOM_LOCAL_QA_HOP=1 npm run build -- --base=/member-portal/
          mkdir -p ../../src/Taranom.OperationsStatus/wwwroot/member-portal
          cp -R dist/. ../../src/Taranom.OperationsStatus/wwwroot/member-portal/
          CI=true python3 ../../tools/policy_checks/authorize_local_portal_csp.py --audience member
          cd ../center-web
          npm ci --no-audit --no-fund --ignore-scripts
          npm run typecheck
          VITE_TARANOM_LOCAL_QA_HOP=1 npm run build -- --base=/center-portal/
          mkdir -p ../../src/Taranom.OperationsStatus/wwwroot/center-portal
          cp -R dist/. ../../src/Taranom.OperationsStatus/wwwroot/center-portal/
          CI=true python3 ../../tools/policy_checks/authorize_local_portal_csp.py --audience center
      - name: Install real Chromium for interactive persistent case workflow
        run: |
          cd apps/center-demo-web
          npx playwright install --with-deps chromium
      - name: Execute PostgreSQL-backed real HTTP, denied business authority and UI QA
        run: |
          cd src/Taranom.CenterWorkflow.Demo
          dotnet run --no-build --configuration Release > /tmp/taranom-center-ephemeral.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          cd "$GITHUB_WORKSPACE"
          ready=0
          for attempt in $(seq 1 60); do
            if curl --silent --fail --max-time 2 http://127.0.0.1:4320/internal/demo/v1/centers/test:readiness > /dev/null; then ready=1; break; fi
            sleep 1
          done
          if test "$ready" != "1"; then
            echo "Ephemeral test-only center host failed to start" >&2
            exit 1
          fi
          python3 tests/center_demo/test_real_center_demo_http.py
          python3 tests/center_demo/test_support_history_http.py
          cd apps/center-demo-web
          CI=true npm run test:e2e
          cd ../member-support-demo-web
          CI=true npm run test:e2e
          cd "$GITHUB_WORKSPACE/src/Taranom.OperationsStatus"
          TARANOM_OPS_REPO_ROOT="$GITHUB_WORKSPACE" dotnet run --no-build --configuration Release > /tmp/taranom-cross-portal-ops.log 2>&1 &
          ops_pid=$!
          trap 'kill "$ops_pid" "$server_pid" 2>/dev/null || true' EXIT
          cd "$GITHUB_WORKSPACE"
          ready_ops=0
          for attempt in $(seq 1 45); do
            if curl --silent --fail --max-time 2 http://127.0.0.1:4318/internal/ops/v1/status >/dev/null; then ready_ops=1; break; fi
            sleep 1
          done
          test "$ready_ops" = "1"
          cd apps/ops-web
          TARANOM_CI_CROSS_PORTAL=1 CI=true npx playwright test tests/cross-portal-qa.spec.ts
      - name: Rehearse real isolated PostgreSQL dump and restored journal integrity
        env:
          CI: 'true'
        run: |
          python3 tools/recovery/rehearse_ephemeral_postgres.py
      - name: Upload PostgreSQL and Chromium synthetic-only workflow evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fullci-center-workflow-full-stack
          path: |
            apps/center-demo-web/test-results/results.xml
            apps/center-demo-web/test-results/**/trace.zip
            apps/member-support-demo-web/test-results/results.xml
            apps/member-support-demo-web/test-results/**/trace.zip
          if-no-files-found: warn
