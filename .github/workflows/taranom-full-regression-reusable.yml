          TARANOM_AI_WORKER_EVIDENCE_TEST_ONLY=CI_EPHEMERAL_ONLY dotnet run --project tests/Taranom.AiWorkerEvidence.Probe/Taranom.AiWorkerEvidence.Probe.csproj --configuration Release
          cd apps/center-demo-web
