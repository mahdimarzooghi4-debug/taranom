        run: npx playwright install --with-deps chromium
      - name: Run Chromium tests against production-bundled preview
        run: npm run test:e2e
        env:
          CI: 'true'
      - name: Upload center web test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fullci-center-web-browser
          path: |
            apps/center-web/test-results/results.xml
            apps/center-web/TestResults/fullci-center-bundle.json
            apps/center-web/TestResults/fullci-epic-console.html
            apps/center-web/TestResults/fullci-epic-console.csv
            apps/center-web/test-results/**/trace.zip
          if-no-files-found: warn

