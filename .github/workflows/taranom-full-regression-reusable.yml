  real-local-ops-http-react:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.401'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Build real localhost-only ASP.NET host and React bundle
        run: |
          dotnet restore src/Taranom.OperationsStatus/Taranom.OperationsStatus.csproj
          dotnet build src/Taranom.OperationsStatus/Taranom.OperationsStatus.csproj --no-restore --configuration Release
          cd apps/ops-web
          npm ci --no-audit --no-fund --ignore-scripts
          npm run typecheck
          npm run build
          mkdir -p ../../src/Taranom.OperationsStatus/wwwroot
          cp -R dist/. ../../src/Taranom.OperationsStatus/wwwroot/
          cd ../member-web
          npm ci --no-audit --no-fund --ignore-scripts
          npm run typecheck
          python3 ../../tests/policy_checks/test_local_portal_csp.py
          VITE_TARANOM_LOCAL_COST_WORKBENCH=1 npm run build -- --base=/member-portal/
          mkdir -p ../../src/Taranom.OperationsStatus/wwwroot/member-portal
          cp -R dist/. ../../src/Taranom.OperationsStatus/wwwroot/member-portal/
          CI=true python3 ../../tools/policy_checks/authorize_local_portal_csp.py --audience member
          cd ../center-web
          npm ci --no-audit --no-fund --ignore-scripts
          npm run typecheck
          npm run build -- --base=/center-portal/
          mkdir -p ../../src/Taranom.OperationsStatus/wwwroot/center-portal
          cp -R dist/. ../../src/Taranom.OperationsStatus/wwwroot/center-portal/
          CI=true python3 ../../tools/policy_checks/authorize_local_portal_csp.py --audience center
      - name: Install browser for real HTTP backend/frontend integration
        run: |
          cd apps/ops-web
          npx playwright install --with-deps chromium
      - name: Execute real Kestrel HTTP, read-only contract, and Chromium
        run: |
          cd src/Taranom.OperationsStatus
          TARANOM_SYNTHETIC_COST_WORKBENCH=CI_EPHEMERAL_ONLY TARANOM_OPS_REPO_ROOT="$GITHUB_WORKSPACE" dotnet run --no-build --configuration Release > /tmp/taranom-ops.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          cd "$GITHUB_WORKSPACE"
          ready=0
          for attempt in $(seq 1 45); do
            if curl --silent --fail --max-time 2 http://127.0.0.1:4318/internal/ops/v1/status > /dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = "1"
          python3 tests/ops_status/test_local_ops_http.py
           python3 tests/ops_status/test_synthetic_cost_http.py
           python3 tests/ops_status/test_synthetic_choice_http.py
          python3 tests/ops_status/test_three_market_entry_http.py
          python3 tests/ops_status/test_payer_scenario_http.py
          python3 tests/ops_status/test_unified_local_surfaces_http.py
          export TARANOM_AI_OFFLINE_TEST_ONLY=CI_EPHEMERAL_ONLY
          export TARANOM_AI_HTTP_TEST_ONLY=CI_EPHEMERAL_ONLY
          ai_tmp=$(mktemp -d /tmp/taranom-ai-qa.XXXXXX)
          python3 -m ai.taranom_internal.server --db "$ai_tmp/registry.sqlite3" > "$RUNNER_TEMP/taranom-ai-http.log" 2>&1 &
          qa_pid=$!
          trap 'kill "$qa_pid" "$server_pid" 2>/dev/null || true' EXIT
          ai_ready=0
          for attempt in $(seq 1 30); do
            if curl --silent --fail --max-time 2 http://127.0.0.1:4335/internal/ai-test/v1/health > /dev/null; then ai_ready=1; break; fi
            sleep 1
          done
          test "$ai_ready" = "1"
          cd apps/ops-web
          CI=true npm run test:e2e
      - name: Upload local-only HTTP/browser QA records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fullci-real-local-ops-http-react
          path: |
            apps/ops-web/test-results/results.xml
            apps/ops-web/test-results/**/trace.zip
          if-no-files-found: warn

