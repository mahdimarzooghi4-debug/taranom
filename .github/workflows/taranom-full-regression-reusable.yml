  center-authority-negative-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.401'
      - name: Restore and compile fail-closed center authority boundary
        run: |
          dotnet restore tests/Taranom.CenterAuthorityBoundary.Tests/Taranom.CenterAuthorityBoundary.Tests.csproj
          dotnet build tests/Taranom.CenterAuthorityBoundary.Tests/Taranom.CenterAuthorityBoundary.Tests.csproj --no-restore --configuration Release
