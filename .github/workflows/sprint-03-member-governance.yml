name: Sprint 03 Internal Member Governance

on:
  push:
    branches: [sprint-03-membership-domain-kernel]
  pull_request:
    branches: [docs/member-integration-sprint-03-contract]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  internal-contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.401'
      - name: Build bounded member governance contract project
        run: |
          dotnet restore tests/Taranom.MemberGovernance.Tests/Taranom.MemberGovernance.Tests.csproj
          dotnet build tests/Taranom.MemberGovernance.Tests/Taranom.MemberGovernance.Tests.csproj --no-restore --configuration Release
      - name: Execute standalone xUnit governance tests
        run: |
          mkdir -p TestResults
          dotnet run --project tests/Taranom.MemberGovernance.Tests/Taranom.MemberGovernance.Tests.csproj --no-build --configuration Release -- -xml TestResults/sprint03-governance.xml
          test -s TestResults/sprint03-governance.xml
      - name: Check missing external adapters remain explicitly blocked
        run: |
          test ! -d src/Taranom.Api
          test ! -d src/Taranom.IdentityProvider
          test ! -d src/Taranom.Payments
          test ! -d src/Taranom.Clinical
          if grep -R -E 'HttpClient|Npgsql|SqlConnection|JwtBearer|Bearer ' src/Taranom.MemberGovernance --include='*.cs'; then
            echo 'Unapproved runtime adapter found in internal governance kernel' >&2
            exit 1
          fi
      - name: Upload machine-readable contract evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sprint03-internal-member-governance
          path: TestResults/sprint03-governance.xml
          if-no-files-found: warn
